---
layout: default
---
<div class="wrap section">
  <div class="split">
    <div class="rail rail--sticky">
      <h1>{{ page.title }}</h1>
      {% if page.summary %}<p class="rail__note">{{ page.summary }}</p>{% endif %}
    </div>
    <div class="flow{% if page.wide %} flow--wide{% endif %}">
      {{ content }}
    </div>
  </div>
</div>
