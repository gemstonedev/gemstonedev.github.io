<!DOCTYPE html>
<html lang="en">
<head>{% include head.html %}</head>
<body>
  <div class="page-shell">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main">{{ content }}</main>
    {% include footer.html %}
  </div>
  <script>
    (function () {
      var header = document.querySelector('.site-header');
      var toggle = document.querySelector('.nav-toggle');
      if (!header || !toggle) return;
      toggle.addEventListener('click', function () {
        var open = header.classList.toggle('nav-open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();

    (function () {
      if (!('IntersectionObserver' in window)) return;
      if (!window.matchMedia('(prefers-reduced-motion: no-preference)').matches) return;

      // stat numbers count up once, when the stat strip scrolls into view
      var counter = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          counter.unobserve(entry.target);
          var el = entry.target;
          var m = el.textContent.trim().match(/^([\d,]+)(.*)$/);
          if (!m) return;
          var target = parseInt(m[1].replace(/,/g, ''), 10);
          var suffix = m[2];
          var start = null, duration = 1300;
          function tick(now) {
            if (start === null) start = now;
            var p = Math.min((now - start) / duration, 1);
            var eased = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(target * eased).toLocaleString('en-US') + suffix;
            if (p < 1) requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        });
      }, { threshold: 0.5 });
      document.querySelectorAll('.stat__n').forEach(function (el) { counter.observe(el); });

      // cells, stats, roadmap steps, and news items rise in as they enter the viewport
      var reveal = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          reveal.unobserve(entry.target);
          entry.target.classList.add('is-visible');
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -36px 0px' });
      document.querySelectorAll('.cells, .stats .wrap, .roadmap, .news-list').forEach(function (group) {
        Array.prototype.forEach.call(group.children, function (child, i) {
          child.classList.add('reveal');
          child.style.setProperty('--reveal-delay', Math.min(i * 70, 350) + 'ms');
          reveal.observe(child);
        });
      });
    })();
  </script>
</body>
</html>
